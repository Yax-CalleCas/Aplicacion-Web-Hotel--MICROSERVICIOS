server:
  port: 8084

spring:
  application:
    name: recepcion-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/db_hotel_recepcion}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:p12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Configuración de RabbitMQ y Spring Cloud Stream
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  cloud:
    stream:
      bindings:
        habitacionEstadoOut-out-0:
          destination: habitacion-estado-cambio-exchange
          binder: rabbit
      rabbit:
        binder:
          connection-timeout: 5000

jwt:
  secret: ${JWT_SECRET:tu_clave_secreta_super_segura_para_firmar_los_tokens_jwt_hotel}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}