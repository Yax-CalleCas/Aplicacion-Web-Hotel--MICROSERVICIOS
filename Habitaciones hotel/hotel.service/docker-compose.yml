version: '3.8'

services:
  postgres-core:
    image: postgres:15-alpine
    container_name: postgres_core_db
    restart: always
    environment:
      POSTGRES_DB: db_hotel_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p12345
    ports:
      - "5433:5432"
    volumes:
      - pgdata_core:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_hotel_core"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hotel-core-net

volumes:
  pgdata_core:

networks:
  hotel-core-net:
    driver: bridge